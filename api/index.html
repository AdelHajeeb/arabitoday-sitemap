<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري الصيانة - اليوم العربي</title>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            text-align: center; 
            padding: 30px; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .container { 
            max-width: 550px; 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 20px; 
            backdrop-filter: blur(10px); 
        }
        h1 { 
            font-size: 1.8em; /* 🔽 تم التصغير */
            margin-bottom: 15px; 
        }
        p { 
            font-size: 1em; /* 🔽 تم التصغير */
            line-height: 1.6; 
            margin-bottom: 20px; 
        }
        .timer { 
            font-size: 1.2em; /* 🔽 تم التصغير */
            font-weight: bold; 
            color: #ffd700; 
        }
        .social { 
            margin-top: 25px; 
        }
        .social a { 
            color: white; 
            margin: 0 8px; 
            text-decoration: none; 
            font-size: 0.9em; /* 🔽 تم التصغير */
        }
        .footer-note {
            margin-top: 25px; 
            font-size: 0.8em; /* 🔽 تم التصغير */
            opacity: 0.9;
        }
        a {
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 جاري الصيانة والتحديث</h1>
        <p>نعمل حالياً على تحسين موقع "اليوم العربي" ليعود إليكم قريباً بشكل أفضل. نشكركم على صبركم وتفهمكم.</p>
        <p class="timer">⏳ الوقت المتوقع: <span id="timer">24 ساعة</span></p>
        <p>للاستفسارات: <a href="mailto:info@arabitoday.net" style="color:#ffd700;">info@arabitoday.net</a></p>
        <div class="social">
            <a href="https://twitter.com/TodayAlarabi" target="_blank">🐦 تويتر</a>
            <a href="https://t.me/todayarabi" target="_blank">✈️ تليجرام</a>
            <a href="https://whatsapp.com/channel/0029Vb7kzlbHAdNUyWVrLc1K" target="_blank">💬 واتساب</a>
        </div>
        <p class="footer-note">فريق اليوم العربي</p>
    </div>
    <script>
        // تحديث الوقت كل ثانية (اختياري)
        let hours = 24;
        setInterval(() => {
            hours -= 1/3600;
            if(hours < 0) hours = 0;
            document.getElementById('timer').textContent = Math.ceil(hours) + ' ساعة';
        }, 1000);
    </script>
